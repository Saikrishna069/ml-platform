# Render Infrastructure-as-Code Manifest for 100% Free Hosting
services:
  # Backend FastAPI Web Service
  - type: web
    name: ml-platform-api
    env: python
    region: singapore # or oregon, frankfurt, ohio
    plan: free
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false # Set to Supabase Postgres URL
      - key: REDIS_URL
        sync: false # Set to Upstash Redis URL
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: '["*"]'
      - key: ENVIRONMENT
        value: "production"
